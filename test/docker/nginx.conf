load_module modules/ngx_http_xngin_module.so;
error_log /dev/stderr warn;
pid /run/nginx.pid;
worker_processes 2;
events { worker_connections 1024; }

http {
    access_log /dev/stdout xnginlog;
    log_format xnginlog '$remote_addr $status act=$xngin_action '
                        'score=$xngin_score rtt_us=$xngin_agent_rtt_us '
                        'cache=$xngin_cache';

    xngin_agent_group waf {
        server unix:/run/mini-waf.sock weight=2;
        server unix:/run/edge-guard.sock weight=1;
        keepalive 2;
        ping_interval 10s;
    }

    xngin_cache_zone verdicts:8m;

    upstream backend { server host.docker.internal:8089; }

    server {
        listen 8080;

        location / {
            xngin_enable on;
            xngin_group waf;
            xngin_mode blocking;
            xngin_timeout 50ms;
            xngin_fail close;
            xngin_body_inspect on;
            xngin_body_max 64k;
            xngin_cache_key $binary_remote_addr$uri;
            proxy_pass http://backend;
        }

        location /monitor {
            xngin_enable on;
            xngin_group waf;
            xngin_mode async;
            proxy_pass http://backend;
        }
    }
}

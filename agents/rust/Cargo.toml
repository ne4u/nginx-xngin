[package]
name = "xngin-rs"
version = "0.1.0"
edition = "2021"
description = "XNAP agent SDK: build traffic-decision agents for nginx"
license = "MIT"

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
async-trait = "0.1"
tokio-rustls = "0.26"
rustls-pemfile = "2"

[dev-dependencies]
serde_json = "1"
rcgen = "0.13"
zentinel-modsec = "0.5"

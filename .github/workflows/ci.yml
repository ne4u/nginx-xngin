name: CI
on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-go@v6
        with: { go-version: '1.22', cache: false }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install pytest && python3 -m pytest test/harness -q
      - run: cd agents/go && go test ./... && go vet ./... && go build ./...
      - run: cd agents/rust && cargo test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-go@v6
        with: { go-version: '1.22', cache: false }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev zlib1g-dev libssl-dev libbrotli-dev
      - name: build nginx + module
        run: |
          curl -fsSL https://nginx.org/download/nginx-1.31.8.tar.gz | tar xz
          cd nginx-1.31.8
          # v3/QUIC intentionally absent: ubuntu-latest's OpenSSL 3.0
          # has no QUIC TLS API, so --with-http_v3_module won't
          # configure. h3 tests skip themselves (stacklib.HAVE_H3).
          ./configure --add-dynamic-module=$GITHUB_WORKSPACE/module \
                      --with-http_ssl_module --with-http_v2_module \
                      --prefix=$PWD/../install
          make -j"$(nproc)" && make install
      - run: pip install pytest brotli
      - env:
          XNGIN_NGINX_BIN: ${{ github.workspace }}/install/sbin/nginx
          XNGIN_MODULE_SO: ${{ github.workspace }}/nginx-1.31.8/objs/ngx_http_xngin_module.so
        run: python3 -m pytest test/cases -q
